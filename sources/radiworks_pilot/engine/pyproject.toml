[project]
name = "radiworks-engine"
version = "0.2.0"
description = "RadiWorks Engine - AetherOnePi-Kernlogik als Kernel-ABI-v1-konformer FastAPI-Dienst (Aurelia-Modul 'Werkbank')"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radiworks = [
    "fixtures/synthetic_catalog/*.md",
    "fixtures/synthetic_catalog/radionics/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
