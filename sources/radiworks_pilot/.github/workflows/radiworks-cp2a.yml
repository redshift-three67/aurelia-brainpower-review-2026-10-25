{
  "name": "RadiWorks CP2A (manual SQLite candidate)",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "radiworks-cp2a",
    "cancel-in-progress": false
  },
  "jobs": {
    "sqlite-candidate": {
      "if": "github.repository == 'redshift-three67/radiworks-pilot' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout reviewed control",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "control",
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout unchanged product reference",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "d1eb34260179a499e2b0362bf609ce96957b78aa",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "name": "Build and attest SQLite candidate only",
          "shell": "bash",
          "env": {
            "PYTHONDONTWRITEBYTECODE": "1",
            "PIP_NO_INPUT": "1",
            "PIP_DISABLE_PIP_VERSION_CHECK": "1"
          },
          "run": "bash control/pilot/ci_cp2a/run-ci.sh"
        }
      ]
    }
  }
}
