[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphic-engine-v1"
version = "0.1.0"
description = "Morphic Engine V1 – modular resonance analysis and harmonization stack."
requires-python = ">=3.10"
authors = [{ name = "Radialgo" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.0",
  "typer[all]>=0.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "requests>=2.31",
  "websockets>=12.0",
  "psutil>=5.9",
  "reportlab>=4.0",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0"]
gpu = ["cupy-cuda12x>=12.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "providers*", "services*", "infra*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "_backups",
  "Benutzer_Archive",
  "PROJECT_MEMORY",
  "tests/exploratory",
]
