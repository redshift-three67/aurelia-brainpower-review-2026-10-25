<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphic Engine 3D Viewer</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b; color: #f4f8ff; font-family: "Segoe UI", Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 18px; left: 18px; z-index: 2; max-width: 360px; pointer-events: none; }
        h1 { margin: 0 0 6px; font-size: 1.15rem; color: #8ee6d2; }
        p { margin: 4px 0; color: rgba(244, 248, 255, 0.78); font-size: 0.9rem; }
        #drop-zone {
            position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
            width: min(340px, calc(100vw - 40px)); min-height: 190px; border: 2px dashed #536072;
            border-radius: 10px; background: rgba(11, 17, 27, 0.88); display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 8px; cursor: pointer; z-index: 3;
        }
        #drop-zone.hover { border-color: #8ee6d2; background: rgba(32, 77, 76, 0.55); }
        #drop-zone.hidden { display: none; }
        #controls {
            position: absolute; right: 18px; bottom: 18px; z-index: 2; display: flex; gap: 8px;
            background: rgba(11, 17, 27, 0.78); padding: 10px; border: 1px solid rgba(142, 230, 210, 0.25); border-radius: 8px;
        }
        button { background: #172233; color: #f4f8ff; border: 1px solid #536072; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
        button:hover { border-color: #8ee6d2; }
        #tooltip {
            position: absolute; z-index: 4; display: none; max-width: 280px; padding: 9px 10px;
            background: rgba(5, 7, 11, 0.92); border: 1px solid rgba(142, 230, 210, 0.35); border-radius: 6px;
            font-size: 0.86rem; pointer-events: none;
        }
        .offline-viewer { color: #8ee6d2; }
    </style>
</head>
<body>
    <canvas id="viewer"></canvas>
    <div id="ui-layer">
        <h1>Morphic Engine 3D Viewer</h1>
        <p class="offline-viewer">Offlinefaehige Canvas-Ansicht ohne CDN-Abhaengigkeit</p>
        <p id="file-info">Keine Datei geladen</p>
    </div>
    <div id="drop-zone">
        <strong>JSON-Export hier ablegen</strong>
        <span>(*_3d_scan.json)</span>
    </div>
    <div id="tooltip"></div>
    <div id="controls">
        <button id="btn-reset" type="button">Reset</button>
        <button id="btn-rotate" type="button">Auto-Rotation: AN</button>
    </div>

    <script>
    (() => {
        const canvas = document.getElementById("viewer");
        const ctx = canvas.getContext("2d");
        const dropZone = document.getElementById("drop-zone");
        const tooltip = document.getElementById("tooltip");
        const fileInfo = document.getElementById("file-info");
        const rotateButton = document.getElementById("btn-rotate");
        let points = [];
        let projected = [];
        let angle = 0;
        let autoRotate = true;
        let mouse = { x: -9999, y: -9999 };

        function resize() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.floor(window.innerWidth * ratio);
            canvas.height = Math.floor(window.innerHeight * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function normalizePoint(raw) {
            const coords = Array.isArray(raw.coords)
                ? raw.coords
                : [raw.x ?? 0, raw.y ?? 0, raw.z ?? 0];
            const value = Number(raw.value ?? raw.score ?? 0);
            const intensity = Number(raw.intensity ?? Math.min(1, Math.max(0, value / 100)));
            return {
                x: Number(coords[0] ?? 0),
                y: Number(coords[1] ?? 0),
                z: Number(coords[2] ?? 0),
                label: String(raw.label ?? raw.id ?? "Unbenannt"),
                id: String(raw.id ?? ""),
                group: String(raw.group ?? raw.layer ?? ""),
                value,
                intensity,
            };
        }

        function colorFor(point) {
            if (point.intensity >= 0.7) return "#ff5a6f";
            if (point.intensity >= 0.4) return "#ffc857";
            return "#57d9ff";
        }

        function project(point) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const scale = Math.min(width, height) * 0.31;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const x = point.x * cos - point.z * sin;
            const z = point.x * sin + point.z * cos;
            const depth = 2.9 + z;
            return {
                point,
                x: width / 2 + (x / depth) * scale,
                y: height / 2 - (point.y / depth) * scale,
                z,
                radius: Math.max(4, 5 + point.intensity * 12),
                color: colorFor(point),
            };
        }

        function drawReference() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            ctx.save();
            ctx.strokeStyle = "rgba(142, 230, 210, 0.14)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(cx, cy - 110, 44, 55, 0, 0, Math.PI * 2);
            ctx.moveTo(cx, cy - 55);
            ctx.lineTo(cx, cy + 145);
            ctx.moveTo(cx - 95, cy - 20);
            ctx.lineTo(cx + 95, cy - 20);
            ctx.moveTo(cx - 55, cy + 145);
            ctx.lineTo(cx - 28, cy + 245);
            ctx.moveTo(cx + 55, cy + 145);
            ctx.lineTo(cx + 28, cy + 245);
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            const gradient = ctx.createRadialGradient(
                window.innerWidth / 2, window.innerHeight / 2, 80,
                window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight)
            );
            gradient.addColorStop(0, "#0d1726");
            gradient.addColorStop(1, "#05070b");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            drawReference();

            projected = points.map(project).sort((a, b) => a.z - b.z);
            for (const item of projected) {
                ctx.beginPath();
                ctx.fillStyle = item.color;
                ctx.globalAlpha = 0.34;
                ctx.arc(item.x, item.y, item.radius * 2.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 0.92;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (autoRotate) angle += 0.004;
            updateTooltip();
            requestAnimationFrame(draw);
        }

        function updateTooltip() {
            const hit = [...projected].reverse().find(item => {
                const dx = item.x - mouse.x;
                const dy = item.y - mouse.y;
                return Math.sqrt(dx * dx + dy * dy) <= item.radius + 5;
            });
            if (!hit) {
                tooltip.style.display = "none";
                return;
            }
            tooltip.innerHTML = `<strong>${hit.point.label}</strong><br>${hit.point.id || hit.point.group}<br>Score: ${hit.point.value.toFixed(1)}<br>Intensitaet: ${(hit.point.intensity * 100).toFixed(0)}%`;
            tooltip.style.left = `${mouse.x + 14}px`;
            tooltip.style.top = `${mouse.y + 14}px`;
            tooltip.style.display = "block";
        }

        function loadJSON(file) {
            const reader = new FileReader();
            reader.onload = event => {
                try {
                    const payload = JSON.parse(event.target.result);
                    if (!Array.isArray(payload.points)) throw new Error("Keine points-Liste gefunden.");
                    points = payload.points.map(normalizePoint);
                    dropZone.classList.add("hidden");
                    fileInfo.textContent = `Geladen: ${file.name} (${points.length} Punkte)`;
                } catch (error) {
                    alert(`JSON konnte nicht geladen werden: ${error.message}`);
                }
            };
            reader.readAsText(file);
        }

        dropZone.addEventListener("dragover", event => {
            event.preventDefault();
            dropZone.classList.add("hover");
        });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("hover"));
        dropZone.addEventListener("drop", event => {
            event.preventDefault();
            dropZone.classList.remove("hover");
            const file = event.dataTransfer.files[0];
            if (file) loadJSON(file);
        });
        dropZone.addEventListener("click", () => {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json,application/json";
            input.onchange = () => input.files[0] && loadJSON(input.files[0]);
            input.click();
        });
        document.getElementById("btn-reset").addEventListener("click", () => { angle = 0; });
        rotateButton.addEventListener("click", () => {
            autoRotate = !autoRotate;
            rotateButton.textContent = `Auto-Rotation: ${autoRotate ? "AN" : "AUS"}`;
        });
        window.addEventListener("mousemove", event => { mouse = { x: event.clientX, y: event.clientY }; });
        window.addEventListener("resize", resize);

        resize();
        draw();
    })();
    </script>
</body>
</html>
