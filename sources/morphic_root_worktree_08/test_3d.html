<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Morphic Engine - 3D Viewer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; }
        #container { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        #legend { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        .legend-item { display: flex; align-items: center; margin: 5px 0; }
        .legend-color { width: 20px; height: 20px; border-radius: 50%; margin-right: 10px; }
        #tooltip { position: absolute; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 5px; display: none; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h3>Morphic Engine 3D</h3>
        <p>Punkte: <span id="point-count">2</span></p>
        <p>🖱️ Ziehen = Drehen | Scrollen = Zoom</p>
    </div>
    <div id="legend">
        <div class="legend-item"><div class="legend-color" style="background:#00FF00"></div>Niedrig (0-30%)</div>
        <div class="legend-item"><div class="legend-color" style="background:#FFFF00"></div>Mittel (30-50%)</div>
        <div class="legend-item"><div class="legend-color" style="background:#FFA500"></div>Erhöht (50-70%)</div>
        <div class="legend-item"><div class="legend-color" style="background:#FF0000"></div>Hoch (70-100%)</div>
    </div>
    <div id="tooltip"></div>
    
    <script>
        const points = [{"x": 58.864172922356865, "y": 58.864172922356865, "z": 48.864172922356865, "label": "Leber", "score": 0.7, "color": "#FF7F00", "radius": 1.5499999999999998}, {"x": 54.31230398579055, "y": 69.31230398579055, "z": 54.31230398579055, "label": "Herz", "score": 0.3, "color": "#00FF00", "radius": 0.95}];
        
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(80, 80, 80);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // Body outline (simplified)
        const bodyGeom = new THREE.CylinderGeometry(15, 12, 80, 16);
        const bodyMat = new THREE.MeshBasicMaterial({ color: 0x333355, wireframe: true, opacity: 0.3, transparent: true });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        body.position.set(50, 50, 50);
        scene.add(body);
        
        // Head
        const headGeom = new THREE.SphereGeometry(10, 16, 16);
        const head = new THREE.Mesh(headGeom, bodyMat);
        head.position.set(50, 95, 50);
        scene.add(head);
        
        // Points
        const pointMeshes = [];
        points.forEach(p => {
            const geom = new THREE.SphereGeometry(p.radius, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: p.color });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(p.x, p.y, p.z);
            mesh.userData = p;
            scene.add(mesh);
            pointMeshes.push(mesh);
        });
        
        // Raycaster for hover
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pointMeshes);
            
            if (intersects.length > 0) {
                const p = intersects[0].object.userData;
                tooltip.innerHTML = `<strong>${p.label}</strong><br>Score: ${p.score.toFixed(3)}`;
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                tooltip.style.display = 'block';
            } else {
                tooltip.style.display = 'none';
            }
        }
        
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
