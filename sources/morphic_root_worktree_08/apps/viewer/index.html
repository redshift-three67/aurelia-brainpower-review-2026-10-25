<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radialgo2 Morphic Viewer 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        h1 { margin: 0; font-size: 1.2rem; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        p { margin: 5px 0; font-size: 0.9rem; opacity: 0.8; }
        
        #drop-zone {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 200px;
            border: 2px dashed #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; background: rgba(20, 20, 20, 0.8);
            transition: all 0.3s; cursor: pointer; pointer-events: auto;
        }
        #drop-zone.hover { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        #drop-zone.hidden { display: none; }
        
        #tooltip {
            position: absolute; padding: 10px; background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444; border-radius: 5px; pointer-events: none;
            display: none; z-index: 20; backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .score-high { color: #ff4444; font-weight: bold; }
        .score-med { color: #ffcc00; font-weight: bold; }
        .score-low { color: #00ffcc; font-weight: bold; }
        
        #controls {
            position: absolute; bottom: 20px; right: 20px; 
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
            pointer-events: auto;
        }
        button {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 5px 10px; cursor: pointer; border-radius: 4px;
        }
        button:hover { background: #444; }
    </style>
    <!-- Three.js from CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="ui-layer">
        <h1>Radialgo2 Morphic Engine</h1>
        <p>3D NLS Visualisierung</p>
        <p id="file-info">Keine Datei geladen</p>
    </div>

    <div id="drop-zone">
        <div style="font-size: 2rem; margin-bottom: 10px;">📂</div>
        <div>JSON-Export hier ablegen</div>
        <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">(*_3d_scan.json)</div>
    </div>

    <div id="tooltip"></div>

    <div id="controls">
        <button id="btn-reset">Kamera Reset</button>
        <button id="btn-rotate">Auto-Rotation: AN</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002); // Tiefe

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3); // Startposition

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Post Processing (Bloom/Glow) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2; // Glow Stärke
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // --- Human Reference (Abstract Grid) ---
        const gridHelper = new THREE.GridHelper(4, 20, 0x333333, 0x111111);
        gridHelper.position.y = -1;
        scene.add(gridHelper);

        // Central Axis
        const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 1, 0)]);
        const axisMat = new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.5 });
        const axis = new THREE.Line(axisGeo, axisMat);
        scene.add(axis);


        // --- Data Handling ---
        let pointsGroup = new THREE.Group();
        scene.add(pointsGroup);
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let intersectedObject = null;
        let autoRotate = true;

        const dropZone = document.getElementById('drop-zone');
        const tooltip = document.getElementById('tooltip');
        const fileInfo = document.getElementById('file-info');

        // --- Drag & Drop Logic ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('hover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            const file = e.dataTransfer.files[0];
            if (file) loadJSON(file);
        });

        function loadJSON(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    visualizeData(data);
                    dropZone.classList.add('hidden');
                    fileInfo.innerText = `Geladen: ${file.name} (${new Date().toLocaleTimeString()})`;
                } catch (err) {
                    alert("Fehler beim Lesen der JSON: " + err);
                }
            };
            reader.readAsText(file);
        }

        function visualizeData(json) {
            // Clear old
            while(pointsGroup.children.length > 0){ 
                pointsGroup.remove(pointsGroup.children[0]); 
            }

            if (!json.points || !Array.isArray(json.points)) {
                alert("Keine 'points' im JSON gefunden!");
                return;
            }

            console.log(`Lade ${json.points.length} Punkte...`);

            const geometry = new THREE.SphereGeometry(0.04, 16, 16);

            json.points.forEach(pt => {
                if (!pt.coords) return;
                
                const [x, y, z] = pt.coords;
                const score = pt.value || 0;
                const intensity = pt.intensity || 0;

                // Color Mapping based on Score/Intensity
                let color = new THREE.Color(0x888888);
                
                // Heuristik: Hohe Intensity = Rot (Alarm), Hoher Score = Relevanz
                if (intensity > 0.7) {
                    color.setHex(0xff3333); // Rot (Hoch akut)
                } else if (intensity > 0.4) {
                    color.setHex(0xffaa00); // Orange (Mittel)
                } else {
                    color.setHex(0x00ccff); // Blau/Cyan (Neutral/Regulation)
                }

                // Wenn Score sehr niedrig -> ausgrauen oder transparenter
                const opacity = 0.4 + (score / 200.0); // Simple mapping

                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5 + (intensity * 2), // Leuchten basierend auf Intensität
                    transparent: true,
                    opacity: 0.9
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x * 2, y * 2, z * 2); // Scale up a bit
                
                // Metadata attached to mesh for tooltip
                sphere.userData = {
                    label: pt.label,
                    id: pt.id,
                    score: score,
                    intensity: intensity,
                    layer: pt.layer
                };

                pointsGroup.add(sphere);

                // Optional: Verbindungslinie zur Mitte (visualisiert "Bezug")
                if (intensity > 0.5) {
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(x*2, y*2, z*2),
                        new THREE.Vector3(0, y*2, 0) // Projektion auf Achse
                    ]);
                    const lineMat = new THREE.LineBasicMaterial({ 
                        color: color, 
                        transparent: true, 
                        opacity: 0.2 
                    });
                    pointsGroup.add(new THREE.Line(lineGeo, lineMat));
                }
            });
        }

        // --- Interaction ---
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Tooltip Position
            tooltip.style.left = event.clientX + 15 + 'px';
            tooltip.style.top = event.clientY + 15 + 'px';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(0, 0, 3);
            controls.reset();
        });

        document.getElementById('btn-rotate').addEventListener('click', (e) => {
            autoRotate = !autoRotate;
            e.target.innerText = `Auto-Rotation: ${autoRotate ? 'AN' : 'AUS'}`;
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (autoRotate) {
                pointsGroup.rotation.y += 0.002;
            }

            // Raycasting
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pointsGroup.children);

            if (intersects.length > 0) {
                // Find first Sphere
                const hit = intersects.find(i => i.object.type === 'Mesh');
                if (hit) {
                    const obj = hit.object;
                    if (intersectedObject !== obj) {
                        // Reset old
                        if (intersectedObject) intersectedObject.scale.set(1,1,1);
                        // Highlight new
                        intersectedObject = obj;
                        intersectedObject.scale.set(1.5, 1.5, 1.5);
                        
                        // Show Tooltip
                        const d = obj.userData;
                        let scoreClass = d.intensity > 0.6 ? 'score-high' : (d.intensity > 0.3 ? 'score-med' : 'score-low');
                        tooltip.innerHTML = `
                            <strong>${d.label}</strong><br>
                            <span style="font-size:0.8em; color:#aaa">${d.id} (${d.layer})</span><br>
                            Score: <span class="${scoreClass}">${d.score.toFixed(1)}</span><br>
                            Intensität: ${(d.intensity*100).toFixed(0)}%
                        `;
                        tooltip.style.display = 'block';
                        document.body.style.cursor = 'pointer';
                    }
                }
            } else {
                if (intersectedObject) {
                    intersectedObject.scale.set(1,1,1);
                    intersectedObject = null;
                    tooltip.style.display = 'none';
                    document.body.style.cursor = 'default';
                }
            }

            // Render with Bloom
            composer.render();
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
